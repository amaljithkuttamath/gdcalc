services:
  mcdxkit:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCDXKIT_PORT:-8765}:8765"
    environment:
      MCDXKIT_PUBLIC_URL: ${MCDXKIT_PUBLIC_URL:-http://127.0.0.1:8765}
      MCDXKIT_ACCESS_TOKEN_FILE: /run/secrets/access_token
    secrets:
      - access_token
    volumes:
      - mcdxkit_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 40s
  caddy:
    image: caddy:2-alpine
    profiles: [cloud]
    restart: unless-stopped
    environment:
      MCDXKIT_DOMAIN: ${MCDXKIT_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mcdxkit:
        condition: service_healthy
secrets:
  access_token:
    file: ./.secrets/access-token
volumes:
  mcdxkit_data:
  caddy_data:
  caddy_config:
