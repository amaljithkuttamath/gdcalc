name: Test, package and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps .
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.112'
      - name: Build pinned calculation engine
        run: gdcalc setup-engine
      - name: Run real-engine and HTTP integration tests
        run: python -m unittest discover -s tests -v

  package:
    name: Installable package and browser syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check src/gdcalc/web/app.js
      - name: Build and inspect distribution
        run: |
          python -m pip install build twine
          python -m build
          python scripts/check_package.py
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gdcalc-python-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  container:
    name: Test and publish container
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: gdcalc:test
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Execute conversion tests inside the image
        run: docker run --rm -v "$PWD:/verify:ro" --entrypoint python gdcalc:test -m unittest discover -s /verify/tests -v
      - name: Smoke test deployed HTTP service
        run: |
          docker run --name gdcalc-test -d -p 127.0.0.1:8765:8765 \
            -e GDCALC_PUBLIC_URL=http://127.0.0.1:8765 \
            -e GDCALC_ACCESS_TOKEN=synthetic-ci-token-not-a-deployment-secret gdcalc:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8765/healthz
          curl --fail --output /dev/null http://127.0.0.1:8765/fonts/plex-regular.ttf
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8765/api/session)" = 401
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs gdcalc-test 2>/dev/null || true
          docker rm -f gdcalc-test 2>/dev/null || true
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag gdcalc:test "$image:sha-$GITHUB_SHA"
          docker tag gdcalc:test "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          echo "Published tested linux/amd64 image: \`$image:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
