name: Repository improvement audit

on:
  release:
    types: [published]
  schedule:
    - cron: '17 13 * * 1' # Monday 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-improvement-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Collect synthetic verification evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        name: Identify the reviewed revision
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.112'
      - name: Install verification prerequisites
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.txt build twine
          python -m pip install --no-deps .
          mcdxkit setup-engine
      - id: checks
        name: Run repository audit
        run: python scripts/audit_repository.py --output .mcdxkit/audit
      - name: Record setup failure without fabricated test results
        if: failure() && steps.revision.outputs.sha != '' && steps.checks.outcome == 'skipped'
        run: python3 scripts/audit_repository.py --setup-failed --output .mcdxkit/audit
      - name: Preserve verification evidence
        if: always() && steps.revision.outputs.sha != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .mcdxkit/audit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  report:
    name: Update evidence-backed tickets
    needs: audit
    if: always() && needs.audit.outputs.revision != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Only trusted default-branch reporter code gets an issue-writing token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repository-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .mcdxkit/audit/
      - name: Deduplicate observed failures
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ needs.audit.outputs.revision }}
        run: |
          python3 scripts/report_audit.py .mcdxkit/audit/report.json \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --expected-revision "$EXPECTED_REVISION" --publish
