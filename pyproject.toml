[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdcalc"
version = "0.2.0"
description = "Generate native Mathcad worksheets from GROUP final local-load summaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lxml>=5.3,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
gdcalc = "gdcalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gdcalc = ["web/*.html", "web/*.css", "web/*.js", "web/fonts/*.ttf", "web/fonts/OFL.txt", "calcpad_bridge/*.cs", "calcpad_bridge/*.csproj"]
