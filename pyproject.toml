[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdcalc"
version = "0.1.0"
description = "Generate native Mathcad worksheets from GROUP final local-load summaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lxml>=5.3,<7"]

[project.scripts]
gdcalc = "gdcalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
