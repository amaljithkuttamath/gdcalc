[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdxkit"
version = "0.3.0"
description = "Open-source Mathcad workflow toolkit: worksheet generation, calculation, CLI and SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lxml>=5.3,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.urls]
Homepage = "https://github.com/amaljithkuttamath/mcdxkit"
Documentation = "https://github.com/amaljithkuttamath/mcdxkit/blob/main/docs/sdk.md"
Issues = "https://github.com/amaljithkuttamath/mcdxkit/issues"
Source = "https://github.com/amaljithkuttamath/mcdxkit"

[project.scripts]
mcdxkit = "mcdxkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcdxkit = ["web/*.html", "web/*.css", "web/*.js", "web/fonts/*.ttf", "web/fonts/OFL.txt", "calcpad_bridge/*.cs", "calcpad_bridge/*.csproj"]
