[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdcalc"
version = "0.2.1"
description = "Engineering worksheet conversion SDK, CLI and local browser server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lxml>=5.3,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.urls]
Homepage = "https://github.com/amaljithkuttamath/gdcalc"
Documentation = "https://github.com/amaljithkuttamath/gdcalc/blob/main/docs/sdk.md"
Issues = "https://github.com/amaljithkuttamath/gdcalc/issues"
Source = "https://github.com/amaljithkuttamath/gdcalc"

[project.scripts]
gdcalc = "gdcalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gdcalc = ["web/*.html", "web/*.css", "web/*.js", "web/fonts/*.ttf", "web/fonts/OFL.txt", "calcpad_bridge/*.cs", "calcpad_bridge/*.csproj"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["agents", "references"]

[tool.ruff.lint]
# Correctness rules only. The codebase keeps its compact style (docs/standards.md: no
# repository-wide reformatting), so layout rules such as E701/E702 stay off.
select = ["E9", "F", "B"]
# Re-raising friendly request errors inside except blocks is intentional.
ignore = ["B904"]

[tool.mypy]
python_version = "3.10"
files = ["src/gdcalc"]
ignore_missing_imports = true
warn_unused_ignores = true
